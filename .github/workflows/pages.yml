# Publishes the docs/ folder (the project's web page) to GitHub Pages.
# One deployment at a time: a push that arrives while another is still deploying waits for it instead of colliding with it.
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Off for now: Pages is not enabled on this repository, so a push to main would only fail here. Runs by hand only (Actions tab);
# to turn it back on, enable Pages as above and put back the trigger:
#   push:
#     branches: [main]
#     paths: ["docs/**", ".github/workflows/pages.yml"]
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
